[pytest]
testpaths = tests backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: 集成测试，需要真实环境或 API Keys
addopts = 
    -p no:launch_testing
    -p no:launch_testing_ros_pytest_entrypoint
    -p no:ament_lint
    -p no:ament_xmllint
    -p no:ament_pep257
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:colcon_core
    --ignore-glob=**/launch_testing_ros_pytest_entrypoint.py
    --ignore-glob=**/opt/ros/**
    --override-ini=python_files=test_*.py
    --override-ini=python_classes=Test*
    --override-ini=python_functions=test_*
# 注意：如果遇到 ROS 插件冲突，请使用 run_tests.sh 脚本
