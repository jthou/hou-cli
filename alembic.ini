# Alembic 配置：任务队列 SQLite 迁移（部署时手动执行 alembic upgrade head）
# 实际 DB 路径在 env.py 中通过 get_storage_manager().get_sqlite_path("task_queue.db") 获取

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 占位 URL，实际由 env.py 覆盖
sqlalchemy.url = sqlite:///task_queue.db

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
