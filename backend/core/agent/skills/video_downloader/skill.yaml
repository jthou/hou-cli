# 视频下载技能配置
# Video Downloader Skill Configuration

name: video_downloader
version: 1.0.0
description: |
  下载视频文件，支持单个或多个视频 URL，支持批量下载。
  
  最佳实践：
  - 对于 Bilibili 视频，如果下载失败，建议使用 cookies：
    yt-dlp --cookies-from-browser chrome "https://www.bilibili.com/video/BVxxx"
  - 可以通过 cookies_from_browser 参数自动从浏览器提取 cookies
  - 或使用 cookies_file 参数提供 cookies 文件
category: media_processing
priority: P0  # 高优先级，优先于 video_summary

# 技能参数定义
parameters:
  - name: url
    type: string
    description: 单个视频 URL
    required: false
  - name: urls
    type: array
    description: 多个视频 URL 列表（批量下载）
    required: false
    items:
      type: string
  - name: output_dir
    type: string
    description: 输出目录（可选，默认使用系统临时目录）
    required: false
  - name: subtitle_only
    type: boolean
    description: 是否只下载字幕（不下载视频）
    required: false
    default: false
  - name: subtitle_lang
    type: string
    description: 字幕语言（如 zh, en, zh-Hans, zh-Hant 等）
    required: false
    default: zh
  - name: cookies_from_browser
    type: string
    description: 从浏览器提取 cookies（可选值：'chrome'、'firefox'、'safari'、'edge'）。对于需要登录的视频（如 Bilibili）特别有用。
    required: false
  - name: cookies_file
    type: string
    description: Cookies 文件路径（Netscape 格式或 JSON 格式）。用于需要登录的视频。
    required: false

# 工具依赖
dependencies:
  tools:
    - name: video_downloader
      version: ">=1.0.0"
    - name: code_executor
      version: ">=1.0.0"

# 工作流定义
workflow:
  steps:
    - name: validate_inputs
      type: code_executor
      description: 验证输入参数，确保至少有一个 URL
      code: |
        import json
        urls = []
        if 'url' in input and input['url']:
            urls.append(input['url'])
        if 'urls' in input and input['urls']:
            urls.extend(input['urls'])
        
        if not urls:
            raise ValueError("至少需要提供一个视频 URL")
        
        # 存储到 config 中供后续步骤使用
        config['urls'] = urls
        config['output_dir'] = input.get('output_dir')
        config['subtitle_only'] = input.get('subtitle_only', False)
        config['subtitle_lang'] = input.get('subtitle_lang', 'zh')
        config['cookies_from_browser'] = input.get('cookies_from_browser')
        config['cookies_file'] = input.get('cookies_file')
        
        # 智能检测：如果是 Bilibili 视频且未提供 cookies，建议使用 cookies
        bilibili_urls = [url for url in urls if 'bilibili.com' in url.lower()]
        if bilibili_urls and not config['cookies_from_browser'] and not config['cookies_file']:
            # 对于 Bilibili 视频，默认尝试从 Chrome 提取 cookies
            config['cookies_from_browser'] = 'chrome'
            print(f"💡 检测到 Bilibili 视频，将自动尝试从 Chrome 浏览器提取 cookies")
        
        # 输出结果（通过 JSON 格式）
        # 注意：同时输出 config 的更新，以便同步回 context
        result = {
            'url_count': len(urls),
            'urls': urls,
            'config_updates': {
                'urls': urls,
                'output_dir': config.get('output_dir'),
                'subtitle_only': config.get('subtitle_only', False),
                'subtitle_lang': config.get('subtitle_lang', 'zh'),
                'cookies_from_browser': config.get('cookies_from_browser'),
                'cookies_file': config.get('cookies_file')
            }
        }
        print(json.dumps(result, ensure_ascii=False))
      outputs:
        url_count: ${result.url_count}
        urls: ${result.urls}
        config_updates: ${result.config_updates}
    
    - name: download_videos
      type: loop
      description: 批量下载视频
      items: ${config.urls}
      item_var: url
      steps:
        # 步骤 1: 下载单个视频
        - name: download_single
          type: tool
          tool: video_downloader
          inputs:
            url: ${url}
            output_dir: ${config.output_dir}
            subtitle_only: ${config.subtitle_only}
            subtitle_lang: ${config.subtitle_lang}
            cookies_from_browser: ${config.cookies_from_browser}
            cookies_file: ${config.cookies_file}
          outputs:
            download_success: ${result.success}
            download_data: ${result.data}
            download_error: ${result.error}
          error_handling:
            on_error: continue  # 失败时继续处理下一个
        # 步骤 2: 如果下载失败且是 Bilibili 视频，尝试使用 cookies 重试
        - name: retry_with_cookies
          type: code_executor
          description: 检查是否需要重试（仅对 Bilibili 视频）
          code: |
            import json
            
            # 获取上一步的下载结果
            download_success = steps[0].get('download_success', False)
            download_error = steps[0].get('download_error', '')
            url = url  # 从循环上下文获取
            
            # 检查是否需要重试
            need_retry = (
                not download_success and
                'bilibili.com' in url.lower() and
                not config.get('cookies_from_browser') and
                not config.get('cookies_file')
            )
            
            result = {
                'need_retry': need_retry,
                'url': url,
                'original_error': download_error
            }
            print(json.dumps(result, ensure_ascii=False))
          outputs:
            need_retry: ${result.need_retry}
            retry_url: ${result.url}
          skip_if: ${steps[0].download_success == true}  # 如果下载成功，跳过重试检查
          error_handling:
            on_error: skip
        # 步骤 3: 如果需要重试，使用 cookies 重新下载
        - name: retry_download
          type: tool
          tool: video_downloader
          skip_if: ${steps[1].need_retry != true}  # 仅在需要重试时执行
          inputs:
            url: ${steps[1].retry_url}
            output_dir: ${config.output_dir}
            subtitle_only: ${config.subtitle_only}
            subtitle_lang: ${config.subtitle_lang}
            cookies_from_browser: chrome  # 使用 Chrome cookies 重试
          outputs:
            retry_result: ${result}
          error_handling:
            on_error: skip
      outputs:
        loop_results: ${_loop_results}

# 配置
config:
  default_output_dir: null  # 使用系统默认目录

